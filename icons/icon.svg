<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa4ee"/>
      <stop offset="1" stop-color="#c2f0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="200" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6d2" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#143a66" flood-opacity="0.35"/>
    </filter>
    <!-- Kurt's torso, in the game's own units (R = 100, facing +x) -->
    <path id="torso" d="M20 -42 Q2 -50 -14 -46 Q-80 -30 -62 30 Q-70 88 -30 88 Q10 92 32 72 Q44 24 38 -24 Q36 -42 20 -42 Z"/>
    <clipPath id="torsoClip"><use href="#torso"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- sunburst radiating from Kurt -->
  <g fill="#fff" opacity="0.2" transform="translate(300 200)">
    <path id="ray" d="M0 0 L-700 -86 L-700 86 Z M0 0 L700 -86 L700 86 Z"/>
    <use href="#ray" transform="rotate(25.7)"/><use href="#ray" transform="rotate(51.4)"/>
    <use href="#ray" transform="rotate(77.1)"/><use href="#ray" transform="rotate(102.8)"/>
    <use href="#ray" transform="rotate(128.5)"/><use href="#ray" transform="rotate(154.2)"/>
  </g>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g id="fg">
  <!-- clouds -->
  <g fill="#fff" opacity="0.92">
    <ellipse cx="78" cy="96" rx="58" ry="32"/><ellipse cx="122" cy="80" rx="42" ry="30"/><ellipse cx="40" cy="88" rx="36" ry="24"/>
    <ellipse cx="456" cy="372" rx="46" ry="24"/><ellipse cx="488" cy="360" rx="32" ry="22"/><ellipse cx="426" cy="366" rx="28" ry="18"/>
  </g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-linecap="round" opacity="0.85">
    <path d="M30 230 l84 -38" stroke-width="9"/><path d="M16 290 l60 -27" stroke-width="7"/>
    <path d="M70 168 l50 -22" stroke-width="6"/><path d="M372 470 l70 -32" stroke-width="7"/>
  </g>

  <!-- the fart cloud: out of the butt, billowing to the bottom-left corner -->
  <g transform="translate(40 22)">
  <g id="puffs">
    <circle cx="226" cy="368" r="22"/><circle cx="208" cy="384" r="28"/><circle cx="-4" cy="470" r="56"/><circle cx="186" cy="404" r="38"/><circle cx="150" cy="438" r="48"/>
    <circle cx="104" cy="468" r="56"/><circle cx="46" cy="498" r="66"/><circle cx="166" cy="484" r="38"/>
    <circle cx="80" cy="424" r="30"/>
  </g>
  <use href="#puffs" fill="#3d7a1c" stroke="#3d7a1c" stroke-width="14"/>
  <use href="#puffs" fill="#9fd45e"/>
  <g fill="#d9f2b0">
    <circle cx="222" cy="364" r="15"/><circle cx="208" cy="366" r="20"/><circle cx="178" cy="396" r="28"/><circle cx="140" cy="428" r="36"/>
    <circle cx="94" cy="456" r="42"/><circle cx="36" cy="486" r="49"/><circle cx="72" cy="416" r="21"/>
  </g>
  <g fill="#fff" opacity="0.75">
    <circle cx="200" cy="358" r="6"/><circle cx="168" cy="386" r="8"/><circle cx="126" cy="414" r="10"/><circle cx="78" cy="440" r="12"/>
  </g>
  <g fill="#6fa83a">
    <circle cx="240" cy="404" r="6"/><circle cx="222" cy="440" r="5"/><circle cx="246" cy="370" r="4"/>
    <circle cx="130" cy="384" r="6"/><circle cx="30" cy="404" r="5"/><circle cx="196" cy="498" r="6"/>
  </g>
  </g>

  <!-- Kurt in his cannonball tuck, climbing nose-up (geometry from src/kurt.js, R = 100),
       fully dressed the way he starts every run (colours from src/clothes.js) -->
  <g transform="translate(292 262) scale(1.42) rotate(-18)" filter="url(#drop)" stroke-linejoin="round" stroke-linecap="round">
    <!-- hair wisps streaming back -->
    <g fill="none" stroke="#4a2f1c" stroke-width="9">
      <path d="M-44 -104 Q-62 -114 -78 -110"/><path d="M-30 -118 Q-46 -134 -64 -134"/>
    </g>
    <!-- far shin and foot, in shade: jeans and a sock -->
    <path d="M60 -6 Q54 44 36 90" fill="none" stroke="#6b3a1f" stroke-width="40"/>
    <path d="M60 -6 Q54 44 36 90" fill="none" stroke="#2b4173" stroke-width="28"/>
    <ellipse cx="52" cy="104" rx="25" ry="12" transform="rotate(28.6 52 104)" fill="#d9d5ca" stroke="#6b3a1f" stroke-width="6"/>
    <!-- torso: blue tee over the chest and back, jeans over the butt -->
    <use href="#torso" fill="#f4c9a0"/>
    <g clip-path="url(#torsoClip)">
      <rect x="-100" y="12" width="200" height="100" fill="#3d5a99"/>
      <rect x="-100" y="12" width="200" height="8" fill="#2b4173"/>
      <rect x="-100" y="-100" width="200" height="118" fill="#3fb8f5"/>
      <rect x="-100" y="12" width="200" height="6" fill="#2a8cc0"/>
      <path d="M-46 40 Q-52 60 -44 80" fill="none" stroke="#2b4173" stroke-width="4" opacity="0.7"/>
    </g>
    <use href="#torso" fill="none" stroke="#6b3a1f" stroke-width="7"/>
    <!-- near thigh hugged to the chest, shin hanging from the knee -->
    <path d="M-24 56 Q18 14 70 -14" fill="none" stroke="#6b3a1f" stroke-width="54"/>
    <path d="M-24 56 Q18 14 70 -14" fill="none" stroke="#3d5a99" stroke-width="42"/>
    <path d="M66 -8 Q58 42 40 88" fill="none" stroke="#6b3a1f" stroke-width="42"/>
    <path d="M66 -8 Q58 42 40 88" fill="none" stroke="#3d5a99" stroke-width="30"/>
    <ellipse cx="57" cy="100" rx="25" ry="12" transform="rotate(28.6 57 100)" fill="#f4f1e8" stroke="#6b3a1f" stroke-width="6"/>
    <!-- near arm down the thigh, hands clasped on the shin -->
    <path d="M2 -30 Q16 76 66 26" fill="none" stroke="#6b3a1f" stroke-width="38"/>
    <path d="M2 -30 Q16 76 66 26" fill="none" stroke="#3fb8f5" stroke-width="26"/>
    <circle cx="63" cy="30" r="15" fill="#e0a97c" stroke="#6b3a1f" stroke-width="5"/>
    <circle cx="79" cy="33" r="15" fill="#e0a97c" stroke="#6b3a1f" stroke-width="5"/>
    <!-- head, in profile -->
    <g transform="translate(6 -62) rotate(19.5)">
      <circle r="58" fill="#f4c9a0" stroke="#6b3a1f" stroke-width="7"/>
      <path d="M22 -50 Q10 -72 -24 -64 Q-60 -52 -58 -12 Q-56 14 -36 22 Q-14 2 2 -14 Q12 -28 10 -38 Q18 -46 22 -50 Z" fill="#4a2f1c" stroke="#6b3a1f" stroke-width="5"/>
      <path d="M-42 -54 Q-30 -40 -34 -20 M-16 -60 Q-6 -44 -10 -26" fill="none" stroke="#7a4f2f" stroke-width="5" opacity="0.6"/>
      <ellipse cx="10" cy="-42" rx="13" ry="8" transform="rotate(-11.5 10 -42)" fill="#fff" opacity="0.12"/>
      <path d="M44.4 24.6 A36 36 0 0 1 -18.8 35.5 Z" fill="rgba(190,120,80,0.3)"/>
      <ellipse cx="-52" cy="2" rx="13" ry="17" transform="rotate(-8.6 -52 2)" fill="#e0a97c" stroke="#6b3a1f" stroke-width="5"/>
      <path d="M-44.1 4.2 A6 6 0 1 1 -49.7 -2.9" fill="none" stroke="#6b3a1f" stroke-width="4"/>
      <path d="M46 -12 Q76 -6 70 9 Q60 12 48 6 Z" fill="#f4c9a0" stroke="#6b3a1f" stroke-width="5"/>
      <!-- giggling: eye squeezed shut, brow up, mouth wide open -->
      <ellipse cx="4" cy="14" rx="13" ry="9" transform="rotate(-5.7 4 14)" fill="#ff8a7a" opacity="0.45"/>
      <path d="M5.3 -9.4 A12 12 0 0 1 26.7 -9.4" fill="none" stroke="#2b2016" stroke-width="7"/>
      <path d="M3.2 -32 A13 13 0 0 1 27.6 -35.9" fill="none" stroke="#7a4628" stroke-width="5" opacity="0.7"/>
      <path d="M14 14 Q36 13 52 22 Q34 25 12 22 Z" fill="#5b3a24"/>
      <path d="M9 28 Q28 21 47 28 Q43 44 28 47 Q13 44 9 28 Z" fill="#7a2020" stroke="#6b3a1f" stroke-width="5"/>
      <ellipse cx="28" cy="27" rx="15" ry="4.5" fill="#fff"/>
    </g>
  </g>
  </g>
</svg>
