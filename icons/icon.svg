<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa4ee"/>
      <stop offset="1" stop-color="#c2f0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="190" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6d2" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#143a66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- sunburst radiating from Kurt -->
  <g fill="#fff" opacity="0.2" transform="translate(300 190)">
    <path id="ray" d="M0 0 L-700 -86 L-700 86 Z M0 0 L700 -86 L700 86 Z"/>
    <use href="#ray" transform="rotate(12.85)" opacity="0"/>
    <use href="#ray" transform="rotate(25.7)"/><use href="#ray" transform="rotate(51.4)"/>
    <use href="#ray" transform="rotate(77.1)"/><use href="#ray" transform="rotate(102.8)"/>
    <use href="#ray" transform="rotate(128.5)"/><use href="#ray" transform="rotate(154.2)"/>
  </g>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- clouds -->
  <g fill="#fff" opacity="0.92">
    <ellipse cx="78" cy="96" rx="58" ry="32"/><ellipse cx="122" cy="80" rx="42" ry="30"/><ellipse cx="40" cy="88" rx="36" ry="24"/>
    <ellipse cx="450" cy="352" rx="46" ry="24"/><ellipse cx="482" cy="340" rx="32" ry="22"/><ellipse cx="420" cy="346" rx="28" ry="18"/>
  </g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-linecap="round" opacity="0.85">
    <path d="M36 220 l84 -38" stroke-width="9"/><path d="M20 282 l60 -27" stroke-width="7"/>
    <path d="M72 160 l50 -22" stroke-width="6"/><path d="M360 470 l70 -32" stroke-width="7"/>
  </g>

  <!-- the fart cloud: billowing from the butt to the bottom-left corner -->
  <g id="puffs">
    <circle cx="218" cy="384" r="34"/><circle cx="178" cy="410" r="42"/><circle cx="136" cy="432" r="50"/>
    <circle cx="92" cy="462" r="58"/><circle cx="40" cy="494" r="66"/><circle cx="150" cy="474" r="40"/>
    <circle cx="66" cy="420" r="34"/>
  </g>
  <use href="#puffs" fill="#3d7a1c" stroke="#3d7a1c" stroke-width="14"/>
  <use href="#puffs" fill="#9fd45e"/>
  <g fill="#d9f2b0">
    <circle cx="210" cy="376" r="25"/><circle cx="170" cy="400" r="31"/><circle cx="126" cy="420" r="37"/>
    <circle cx="82" cy="448" r="43"/><circle cx="30" cy="480" r="49"/><circle cx="58" cy="410" r="24"/>
  </g>
  <g fill="#fff" opacity="0.75">
    <circle cx="200" cy="366" r="7"/><circle cx="158" cy="388" r="9"/><circle cx="112" cy="404" r="11"/><circle cx="66" cy="430" r="12"/>
  </g>
  <g fill="#6fa83a">
    <circle cx="246" cy="420" r="7"/><circle cx="214" cy="450" r="5"/><circle cx="196" cy="350" r="5"/>
    <circle cx="120" cy="380" r="6"/><circle cx="26" cy="400" r="5"/><circle cx="168" cy="494" r="6"/>
  </g>

  <!-- Kurt: leaning back into the climb, laughing his head off -->
  <g transform="rotate(-8 280 250)" filter="url(#drop)">
    <!-- silhouette: outline pass then fill pass so the shapes merge -->
    <g id="kurt">
      <ellipse cx="278" cy="176" rx="90" ry="96"/>
      <ellipse cx="290" cy="318" rx="80" ry="90"/>
      <ellipse cx="190" cy="190" rx="24" ry="31"/>
      <ellipse cx="366" cy="198" rx="30" ry="21"/>
      <ellipse cx="336" cy="392" rx="40" ry="22"/>
    </g>
    <use href="#kurt" fill="#4a2410" stroke="#4a2410" stroke-width="18" stroke-linejoin="round"/>
    <use href="#kurt" fill="#f6c9a0"/>
    <!-- body shading -->
    <path d="M222 300 C 222 360 250 398 300 404 C 270 384 252 350 254 300 Z" fill="#e7ad80" opacity="0.6"/>
    <path d="M300 366 q 14 8 26 0" fill="none" stroke="#b9764c" stroke-width="5" stroke-linecap="round"/>
    <path d="M262 382 C 290 396 320 398 346 386" fill="none" stroke="#4a2410" stroke-width="6" stroke-linecap="round"/>
    <!-- ear -->
    <path d="M196 176 c -12 0 -16 12 -12 22 c 4 8 12 8 14 2" fill="none" stroke="#c98a5e" stroke-width="6" stroke-linecap="round"/>
    <!-- hair: swept over, tufts on top -->
    <g fill="#5a341c" stroke="#3a1d0c" stroke-width="7" stroke-linejoin="round">
      <path d="M194 182 C 186 124 214 90 264 82 C 304 78 334 90 350 112 C 316 106 286 124 268 152 C 254 178 242 204 222 218 C 206 214 196 200 194 182 Z"/>
      <path d="M214 104 c -6 -18 0 -32 12 -38 c 2 12 6 22 14 28 Z"/>
      <path d="M244 88 c -2 -20 8 -32 20 -36 c 0 12 4 22 12 30 Z"/>
      <path d="M278 82 c 2 -18 14 -28 26 -30 c -2 12 0 22 6 32 Z"/>
      <path d="M308 88 c 6 -14 18 -20 30 -20 c -4 10 -4 20 0 28 Z"/>
    </g>
    <path d="M218 132 C 226 112 244 100 266 96 M214 168 C 222 146 240 126 262 116" fill="none" stroke="#8a5a32" stroke-width="5" stroke-linecap="round"/>
    <!-- closed, crinkled laughing eye -->
    <path d="M290 166 Q 308 144 326 166" fill="none" stroke="#2b2016" stroke-width="9" stroke-linecap="round"/>
    <path d="M330 150 l10 -6" stroke="#2b2016" stroke-width="5" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M338 180 C 360 174 396 180 396 202 C 396 220 370 222 350 214" fill="#f2b88c" stroke="#4a2410" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- cheek -->
    <circle cx="296" cy="206" r="16" fill="#ff8a7a" opacity="0.45"/>
    <!-- wide open laugh -->
    <path d="M286 236 C 292 296 354 300 364 238 Z" fill="#8a2420" stroke="#4a2410" stroke-width="7" stroke-linejoin="round"/>
    <path d="M300 268 C 314 286 342 286 352 268 C 340 260 312 260 300 268 Z" fill="#e0707a"/>
    <path d="M292 240 H358 L354 254 H296 Z" fill="#fff"/>
    <!-- mustache -->
    <path d="M280 236 C 292 216 320 214 330 228 C 340 214 370 216 378 236 C 362 232 346 242 330 238 C 314 242 296 232 280 236 Z" fill="#5b3a24" stroke="#3a1d0c" stroke-width="6" stroke-linejoin="round"/>
    <!-- arms hugged in, fists clasped -->
    <path d="M300 300 C 318 322 340 336 362 342" fill="none" stroke="#4a2410" stroke-width="40" stroke-linecap="round"/>
    <path d="M300 300 C 318 322 340 336 362 342" fill="none" stroke="#f6c9a0" stroke-width="24" stroke-linecap="round"/>
    <circle cx="364" cy="342" r="24" fill="#f6c9a0" stroke="#4a2410" stroke-width="8"/>
    <circle cx="388" cy="340" r="22" fill="#f6c9a0" stroke="#4a2410" stroke-width="8"/>
    <path d="M376 326 v30" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
